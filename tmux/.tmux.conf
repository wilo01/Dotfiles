# Linux only
set -g mouse on
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set-option -a terminal-features 'xterm-256color:RGB'
set -s escape-time 10
set-option -g focus-events on
set -gq allow-passthrough on
set-option -g history-limit 10000

# Status bar
set-option -g status-position top
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-justify right
set -g status-left ' 📅 %d.%m.%Y 🕒 %I:%M %p - [#S]'
set -g status-right ' #(git rev-parse --abbrev-ref HEAD 2>/dev/null | grep -v "^HEAD$" || echo "") '
set -g status-left-length 50
set -g status-right-length 50

# Restore session
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# Use vim keybindings in copy mode
setw -g mode-keys vi
# bind-key x if-shell '[ $(tmux list-sessions | wc -l) -ne 1 ]' \
#                  "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'" \
#                  "run-shell 'tmux new-session -c \"$HOME\"'"
bind-key z if-shell '[ "$(tmux list-panes | wc -l)" -gt 1 ]' 'kill-pane' 'new-session -c "#{pane_current_path}"'
bind-key & kill-window

# Update default binding of `Enter` to also use copy-pipe with xclip in Linux
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# New tmux config primagen
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf

set-window-option -g mode-keys vi

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Window navigation
bind -r b next-window
bind -r n next-window
bind -r N previous-window

# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# Toggle (show/hide) a pane using zoom
bind-key a if-shell '[ "$(tmux display -p "#{window_panes}")" -eq 1 ]' \
    'split-window -h' \
    'if-shell "[ \"$(tmux display -p \"#{window_zoomed_flag}\")\" -eq 1 ]" \
        "resize-pane -Z; select-pane -t 2" \
        "select-pane -t 1; resize-pane -Z"'

# bind-key -r ` if-shell -F "#{==:#{session_name},popup}" "detach-client" "popup -w 90% -h 90% -E \"tmux attach -t popup || tmux new -s popup\""
bind-key -n C-Space if-shell -F "#{==:#{session_name},popup}" \
    "detach-client" \
    "popup -d '#{pane_current_path}' -w 90% -h 90% -E -R \"tmux attach -t popup || tmux new -s popup\""

# Tmux-sessionizer
bind-key -r f run-shell "tmux neww ~/bin/.local/scripts/tmux-sessionizer"
bind-key -r D run-shell "~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles"
bind-key -r P run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/Private"
bind-key -r B run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/"
bind-key -r S run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/"
bind-key -r T run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-student/"
bind-key -r V run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/visitor-web-app/"
bind-key -r H run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-hexer/"
