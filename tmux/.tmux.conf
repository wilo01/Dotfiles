# ─── OS-Specific: Terminal & Environment ───────────────────────────────────────
if-shell "uname | grep -q Darwin" {
    set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin:/usr/sbin:/sbin:$HOME/bin/.local/scripts"
    set -s escape-time 0
    set -gq allow-passthrough on
} {
    set -s escape-time 10
    set -g allow-passthrough on
    set -ga update-environment TERM
    set -ga update-environment TERM_PROGRAM
    set-option -g history-limit 10000
}

# ─── Common: Terminal Options ──────────────────────────────────────────────────
set -g mouse on
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set-option -a terminal-features 'xterm-256color:RGB'
set-option -g focus-events on
set -g default-terminal "tmux-256color"

# ─── Status Bar ────────────────────────────────────────────────────────────────
set-option -g status-position top
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-justify right
set -g status-left ' 📅 %d.%m.%Y 🕒 %I:%M %p - [#S]'
set -g status-right ' #(git rev-parse --abbrev-ref HEAD 2>/dev/null | grep -v "^HEAD$" || echo "") '
set -g status-left-length 50
set -g status-right-length 50

# ─── Plugins (TPM) ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ─── Mouse / Wheel Bindings ────────────────────────────────────────────────────
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# ─── Copy Mode ─────────────────────────────────────────────────────────────────
setw -g mode-keys vi

if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    unbind -T copy-mode-vi Enter
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

# ─── Kill Bindings ─────────────────────────────────────────────────────────────
bind-key x if-shell '[ "$(tmux list-windows | wc -l)" -gt 1 ]' 'kill-window' 'if-shell "[ \"$(tmux list-sessions | wc -l)\" -gt 1 ]" "run-shell \"tmux switch-client -n; tmux kill-session -t #{session_name}\"" "new-session -c \"#{pane_current_path}\""'
bind-key z if-shell '[ "$(tmux display -p "#{window_panes}")" -gt 1 ]' 'kill-pane' 'if-shell "[ \"$(tmux list-windows | wc -l)\" -gt 1 ]" "kill-pane" "if-shell \"[ \\\"$(tmux list-sessions | wc -l)\\\" -gt 1 ]\" \"run-shell \\\"tmux switch-client -n; tmux kill-session -t #{session_name}\\\"\" \"kill-pane\""'
bind-key & kill-window

# ─── Windows & Panes ───────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf

set-window-option -g mode-keys vi

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ─── Pane Toggle (zoom-aware) ──────────────────────────────────────────────────
bind-key A resize-pane -Z
bind-key a if-shell '[ "$(tmux display -p "#{window_panes}")" -eq 1 ]' \
    'split-window -v' \
    'if-shell "[ \"$(tmux display -p \"#{window_zoomed_flag}\")\" -eq 1 ]" \
        "resize-pane -Z; select-pane -t 2" \
        "select-pane -t 1; resize-pane -Z"'
bind-key -n M-A resize-pane -Z
bind-key -n M-a if-shell '[ "$(tmux display -p "#{window_panes}")" -eq 1 ]' \
    'split-window -v' \
    'if-shell "[ \"$(tmux display -p \"#{window_zoomed_flag}\")\" -eq 1 ]" \
        "resize-pane -Z; select-pane -t 2" \
        "select-pane -t 1; resize-pane -Z"'

# ─── Popup & Window Navigation ─────────────────────────────────────────────────
bind-key -n C-Space if-shell -F "#{==:#{session_name},popup}" \
    "detach-client" \
    "popup -d '#{pane_current_path}' -w 90% -h 90% -E -R \"tmux attach -t popup || tmux new -s popup\""

bind -r n next-window
bind -r N previous-window
bind -r b previous-window

# ─── Tmux Sessionizer (common) ─────────────────────────────────────────────────
bind-key -r f run-shell "tmux neww ~/bin/.local/scripts/tmux-sessionizer"
bind-key -r D run-shell "~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles"
bind-key -r d run-shell "~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles"
bind-key -r P run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/Private"

# ─── Tmux Sessionizer (project paths — adjust MacOS paths as needed) ───────────
if-shell "uname | grep -q Darwin" {
    bind-key -r B run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/"
    bind-key -r H run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/tds-hexer/"
    bind-key -r S run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/"
    bind-key -r T run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-student/"
    bind-key -r V run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-visitor-web-app/"
    bind-key -r K run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-kiosk-chrome-app/"
    bind-key -r I run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-kiosk-iwa/"
    bind-key -r E run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/"
} {
    bind-key -r B run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/"
    bind-key -r H run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-hexer/"
    bind-key -r S run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-suite/"
    bind-key -r T run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-student/"
    bind-key -r V run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-visitor-web-app/"
    bind-key -r K run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-kiosk-chrome-app/"
    bind-key -r I run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-kiosk-iwa/"
    bind-key -r E run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/"
}

# ─── Tool Popups ───────────────────────────────────────────────────────────────
if-shell "uname | grep -q Darwin" {
    bind-key -r g popup -d '#{pane_current_path}' -w 90% -h 90% -E "lazygit"
    bind-key -r G popup -d '#{pane_current_path}' -w 90% -h 90% -E "lazydocker"
    bind-key -r y popup -d '#{pane_current_path}' -w 90% -h 90% -E "yazi"
} {
    bind-key -r g popup -d '#{pane_current_path}' -w 90% -h 90% -E "/usr/bin/lazygit"
    bind-key -r G popup -d '#{pane_current_path}' -w 90% -h 90% -E "/home/dariuszw/go/bin/lazydocker"
    bind-key -r y popup -d '#{pane_current_path}' -w 90% -h 90% -E "/usr/bin/yazi"
}

# ─── M-r: Shift-Tab (Claude Code mode switch in Termius) ──────────────────────
unbind -n M-r
bind -n M-r send-keys Escape '[' 'Z'

# ─── M-q: Quick Menu ───────────────────────────────────────────────────────────
if-shell "uname | grep -q Darwin" {
    bind-key -n M-q display-menu -x W -y S \
        "New Session"                        S "command-prompt -p \"New Session:\" \"new-session -A -s '%%'\"" \
        "#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z" \
        "" \
        "Session Finder"                     f "run-shell \"tmux neww ~/bin/.local/scripts/tmux-sessionizer\"" \
        "Dotfiles"                           D "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles\"" \
        "Private"                            P "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/Private\"" \
        "Branch Opener"                      B "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/\"" \
        "TDS Suite"                          S "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/\"" \
        "TDS Student"                        T "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-student/\"" \
        "Visitor Web App"                    V "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-visitor-web-app/\"" \
        "TDS Hexer"                          H "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/tds-hexer/\"" \
        "" \
        "New Window"                         ␍ new-window \
        "Choose Window"                      w choose-window \
        "Previous Window"                    🡠 previous-window \
        "Next Window"                        🡢 next-window \
        "Swap Window Right"                  ↑ "swap-window -t -1" \
        "Swap Window Left"                   ↓ "swap-window -t +1" \
        "Horizontal Split"                   v "split-window -h" \
        "Vertical Split"                     s "split-window -v" \
        "" \
        "Layout Horizontal"                  h "select-layout even-horizontal" \
        "Layout Vertical"                    k "select-layout even-horizontal" \
        "" \
        "Swap Pane Up"                       < "swap-pane -U" \
        "Swap Pane Down"                     > "swap-pane -D" \
        "Break Pane"                         t break-pane \
        "Join Pane"                          j "choose-window 'join-pane -h -s \"%%\"'" \
        "" \
        "Kill Window"                        k "killw" \
        "Kill Session"                       x "kill-session" \
        "Kill Other Session(s)"              X "kill-session -a"
} {
    bind-key -n M-q display-menu -x W -y S \
        "New Session"                        S "command-prompt -p \"New Session:\" \"new-session -A -s '%%'\"" \
        "#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z" \
        "" \
        "Session Finder"                     f "run-shell \"tmux neww ~/bin/.local/scripts/tmux-sessionizer\"" \
        "Dotfiles"                           D "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles\"" \
        "Private"                            P "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/Private\"" \
        "Branch Opener"                      B "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/\"" \
        "TDS Suite"                          S "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/\"" \
        "TDS Student"                        T "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-student/\"" \
        "Visitor Web App"                    V "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/visitor-web-app/\"" \
        "TDS Hexer"                          H "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-hexer/\"" \
        "" \
        "New Window"                         ␍ new-window \
        "Choose Window"                      w choose-window \
        "Previous Window"                    🡠 previous-window \
        "Next Window"                        🡢 next-window \
        "Swap Window Right"                  ↑ "swap-window -t -1" \
        "Swap Window Left"                   ↓ "swap-window -t +1" \
        "Horizontal Split"                   v "split-window -h" \
        "Vertical Split"                     s "split-window -v" \
        "" \
        "Layout Horizontal"                  h "select-layout even-horizontal" \
        "Layout Vertical"                    k "select-layout even-horizontal" \
        "" \
        "Swap Pane Up"                       < "swap-pane -U" \
        "Swap Pane Down"                     > "swap-pane -D" \
        "Break Pane"                         t break-pane \
        "Join Pane"                          j "choose-window 'join-pane -h -s \"%%\"'" \
        "" \
        "Kill Window"                        k "killw" \
        "Kill Session"                       x "kill-session" \
        "Kill Other Session(s)"              X "kill-session -a"
}

# ─── TPM Init (must be last) ───────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
