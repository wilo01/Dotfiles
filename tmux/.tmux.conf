# Linux only
set -g mouse on
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set-option -a terminal-features 'xterm-256color:RGB'
set -s escape-time 10
set-option -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set-option -g history-limit 10000

# Status bar
set-option -g status-position top
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-justify right
set -g status-left ' 📅 %d.%m.%Y 🕒 %I:%M %p - [#S]'
# set -g status-right '#(~/.Dotfiles/tmux/battery.sh) #(git rev-parse --abbrev-ref HEAD 2>/dev/null | grep -v "^HEAD$" || echo "") '
set -g status-left-length 50
# Wide enough for the Claude chips plus the pane title and clock. Emoji are
# double-width, so three sessions alone cost ~28 columns against a ~39-column tail.
set -g status-right-length 100

set -g status-interval 1
# One chip per other session, ageing from a bell through moon phases. The chips
# lead, so the leading pad they would otherwise need is theirs.
set -g status-right '#(~/.Dotfiles/tmux/claude-status.sh "#{client_session}")#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
# Commas inside #[...] are escaped as #, because they would otherwise end the #{?} arm.
# Nerd Font icons (MesloLGS NF), which are monochrome and so take the fg colour —
# unlike emoji, which terminals draw in their own palette and would ignore it, so
# the finished arm below is deliberately left unstyled.
# Bell U+F0F3, cog U+F013.
# Without hook state, a claude pane resting on the U+2733 title glyph reads as
# idle and anything else (a spinner frame) reads as running. The running arm
# renders that live frame rather than a static icon, so it animates like Claude's
# own spinner does — which is why status-interval is 1 rather than 5.
# The final arm falls back to the running process, so a pane running claude shows
# up even before any hook has fired for it.
# A tmux format cannot do arithmetic on a timestamp, so the finished arm holds its
# bell until the next prompt rather than ageing into a moon. status-right and
# prefix + W are the surfaces that age; this is a per-window hint only.
set -g @claude_marker '#{?#{==:#{@claude_state},waiting},#[fg=#f7768e#,bold] ,#{?#{==:#{@claude_state},done},🔔 ,#{?#{==:#{pane_current_command},claude},#{?#{m:✳*,#{pane_title}},#{?#{==:#{@claude_state},running},#{?#{m:*[02468],%S},#[fg=#ff9e64#,bold],#[fg=#565f89#,nobold]} ,#[fg=#a9b1d6#,nobold] },#{?#{m:*[02468],%S},#[fg=#ff9e64#,bold],#[fg=#565f89#,nobold]} }, }}}'

# prefix + W menu. The labels carry their own fg per state, so the selection can
# only be signalled by background — and it must be dark enough that red, yellow,
# green and grey text all stay legible on it.
set -g menu-style 'bg=#1a1b26,fg=#c0caf5'
set -g menu-selected-style 'bg=#292e42,bold'
set -g menu-border-style 'fg=#7aa2f7'

# The window name carries its own explicit style rather than relying on #[default],
# so the marker's colour cannot bleed into it. The selected window is marked by
# text colour alone, keeping the bar's single background.
set -g window-status-format '#[bg=default,fg=#a9b1d6,nobold]#{E:@claude_marker}#[bg=default,fg=#a9b1d6,nobold]#I:#W#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#[bg=default,fg=#7aa2f7,bold]#{E:@claude_marker}#[bg=default,fg=#7aa2f7,bold]#I:#W#{?window_flags,#{window_flags}, }'

# Session restore. Loaded by run-shell at the bottom of this file rather than
# through TPM, matching how tmux-harpoon is wired up.
# Order matters: continuum drives resurrect, so resurrect must load first.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# hlp agent windows are named after their repo and cwd into its worktree, so
# restoring the pane's directory is what brings a ticket's session back intact.
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

bind -N "copy: scroll up (enters copy-mode)" -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -N "copy: scroll down" -n WheelDownPane select-pane -t= \; send-keys -M
bind -N "copy: enter copy-mode (ctrl-scroll)" -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# Use vim keybindings in copy mode
bind-key -N "window: smart kill (window, else session, else respawn)" x if-shell '[ "$(tmux list-windows | wc -l)" -gt 1 ]' 'kill-window' 'if-shell "[ \"$(tmux list-sessions | wc -l)\" -gt 1 ]" "run-shell \"tmux switch-client -n; tmux kill-session -t #{session_name}\"" "new-session -c \"#{pane_current_path}\""'
bind-key -N "pane: smart kill (pane, else window, else session)" z if-shell '[ "$(tmux display -p "#{window_panes}")" -gt 1 ]' 'kill-pane' 'if-shell "[ \"$(tmux list-windows | wc -l)\" -gt 1 ]" "kill-pane" "if-shell \"[ \\\"$(tmux list-sessions | wc -l)\\\" -gt 1 ]\" \"run-shell \\\"tmux switch-client -n; tmux kill-session -t #{session_name}\\\"\" \"kill-pane\""'
bind-key -N "window: kill window" & kill-window

# Update default binding of `Enter` to also use copy-pipe with xclip in Linux
unbind -T copy-mode-vi Enter
bind-key -N "copy: yank selection to clipboard" -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -N "copy: yank mouse selection to clipboard" -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -N "pane: focus left (no prefix)" -n C-Left select-pane -L
bind -N "pane: focus right (no prefix)" -n C-Right select-pane -R
bind -N "pane: focus up (no prefix)" -n C-Up select-pane -U
bind -N "pane: focus down (no prefix)" -n C-Down select-pane -D

# New tmux config primagen
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind -N "config: reload ~/.tmux.conf" r source-file ~/.tmux.conf

set-window-option -g mode-keys vi

# vim-like pane switching
bind -N "window: last window" -r ^ last-window
bind -N "pane: focus up" -r k select-pane -U
bind -N "pane: focus down" -r j select-pane -D
bind -N "pane: focus left" -r h select-pane -L
bind -N "pane: focus right" -r l select-pane -R

# Window navigation
bind -N "window: next" -r n next-window
bind -N "window: previous" -r N previous-window
bind -N "window: previous" -r b previous-window

# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# Toggle (show/hide) a pane using zoom
bind-key -N "pane: toggle zoom" A resize-pane -Z
bind-key -N "pane: split down, else toggle zoom between the two panes" a if-shell '[ "$(tmux display -p "#{window_panes}")" -eq 1 ]' \
    'split-window -v' \
    'if-shell "[ \"$(tmux display -p \"#{window_zoomed_flag}\")\" -eq 1 ]" \
        "resize-pane -Z; select-pane -t 2" \
        "select-pane -t 1; resize-pane -Z"'
bind-key -N "pane: toggle zoom (no prefix)" -n M-A resize-pane -Z
bind-key -N "pane: split down, else toggle zoom (no prefix)" -n M-a if-shell '[ "$(tmux display -p "#{window_panes}")" -eq 1 ]' \
    'split-window -v' \
    'if-shell "[ \"$(tmux display -p \"#{window_zoomed_flag}\")\" -eq 1 ]" \
        "resize-pane -Z; select-pane -t 2" \
        "select-pane -t 1; resize-pane -Z"'

# Break current pane out into its own window (follow it)
# prefix t is claimed by tmux-harpoon (harpoon.tmux breakout), which loads at the
# run-shell below and therefore wins. Left here as a signpost, not a binding.
# bind-key t break-pane

# bind-key -r ` if-shell -F "#{==:#{session_name},popup}" "detach-client" "popup -w 90% -h 90% -E \"tmux attach -t popup || tmux new -s popup\""
bind-key -N "session: toggle the floating popup session (no prefix)" -n C-Space if-shell -F "#{==:#{session_name},popup}" \
    "detach-client" \
    "popup -d '#{pane_current_path}' -w 90% -h 90% -E -R \"tmux attach -t popup || tmux new -s popup\""

# Tmux-sessionizer
bind-key -N "project: session finder (fzf over all projects)" -r f run-shell "tmux neww ~/bin/.local/scripts/tmux-sessionizer"
bind-key -N "project: dotfiles" -r D run-shell "~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles"
bind-key -N "project: dotfiles" -r d run-shell "~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles"
bind-key -N "project: private dev" -r P run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/Private"
bind-key -N "project: branch-opener" -r B run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/"
bind-key -N "project: tds-hexer" -r H run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/tds-hexer/"
bind-key -N "project: tds-suite" -r S run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-suite/"
bind-key -N "project: tds-student" -r T run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-student/"
bind-key -N "project: tds-visitor-web-app" -r V run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-visitor-web-app/"
# prefix K is claimed by tmux-harpoon (prev pinned session). Reach kiosk-chrome-app
# through prefix f instead.
# bind-key -r K run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-kiosk-chrome-app/"
bind-key -N "project: tds-kiosk-iwa" -r I run-shell "~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-kiosk-iwa/"
bind-key -N "agents: jump to a Claude/Copilot pane" W run-shell "~/.Dotfiles/tmux/claude-jump.sh"
# bind-key -r E run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/"
# prefix t (break pane into Jira-named session + pin it) moved to tmux-harpoon: harpoon.sh breakout
# bind-key -r H run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-hexer/"
# bind-key -r S run-shell "~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/branches/tds-suite/"
# bind-key -r h run-shell "~/bin/.local/scripts/tmux-sessionizer ~//Dev/harbinger/"

# Tmux-harpoon: prefix 1-9 jump to pinned sessions, prefix E pins, prefix e opens menu
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
run-shell ~/.tmux/plugins/tmux-harpoon/harpoon.tmux

# resurrect binds C-s/C-r itself, without notes, so prefix ? and prefix / would
# show them as unlabelled. Rebound identically here purely to attach a note.
bind-key -N "session: save all sessions (resurrect)" C-s run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
bind-key -N "session: restore saved sessions (resurrect)" C-r run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh

# Keybinding cheatsheet. Overrides the default prefix ? (raw list-keys).
bind-key -N "config: show all keybindings" ? \
    display-popup -E -w 80% -h 80% -T ' keys ' "~/.Dotfiles/tmux/keys-help.sh"

# Popups
bind-key -N "popup: lazygit" -r g popup -d '#{pane_current_path}' -w 90% -h 90% -E "/usr/bin/lazygit"
bind-key -N "popup: lazydocker" -r G popup -d '#{pane_current_path}' -w 90% -h 90% -E "/home/dariuszw/go/bin/lazydocker"
bind-key -N "popup: yazi file manager" -r Y popup -d '#{pane_current_path}' -w 90% -h 90% -E "/usr/bin/yazi"
bind-key -N "pane: copy current path to clipboard" y run-shell 'printf %s "#{pane_current_path}" | wl-copy' \; display-message "copied: #{pane_current_path}" # Copy filepath to clipboard using wl-copy (Wayland)

# Open the current session name as a Jira ticket (only when it looks like a Jira key)
bind-key -N "session: open the session name as a Jira ticket" O run-shell 'name=$(printf %s "#{session_name}" | tr "[:lower:]" "[:upper:]"); if printf %s "$name" | grep -qE "^[A-Z]+-[0-9]+$"; then xdg-open "https://acre-identity.atlassian.net/browse/$name" >/dev/null 2>&1; else tmux display-message "Not a Jira key: $name"; fi'
bind-key -N "session: open the session name as a Jira ticket" o run-shell 'name=$(printf %s "#{session_name}" | tr "[:lower:]" "[:upper:]"); if printf %s "$name" | grep -qE "^[A-Z]+-[0-9]+$"; then xdg-open "https://acre-identity.atlassian.net/browse/$name" >/dev/null 2>&1; else tmux display-message "Not a Jira key: $name"; fi'

# Map Alt-r to send Shift-Tab (ESC [ Z) for switching Claude Code modes in Termius
unbind -n M-r
bind -N "config: send Shift-Tab (Claude mode switch in Termius)" -n M-r send-keys Escape '[' 'Z'

bind-key -N "config: action menu (no prefix)" -n M-q display-menu -x W -y S \
    "New Session"                        N "command-prompt -p \"New Session:\" \"new-session -A -s '%%'\"" \
    "#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z" \
    "" \
    "Keybindings"                        ? "display-popup -E -w 80% -h 80% -T ' keys ' \"~/.Dotfiles/tmux/keys-help.sh\"" \
    "" \
    "Session Finder"                     f "run-shell \"tmux neww ~/bin/.local/scripts/tmux-sessionizer\"" \
    "Dotfiles"                           D "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/.Dotfiles\"" \
    "Private"                            P "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/Private\"" \
    "Branch Opener"                      B "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/Dev/branch-opener/\"" \
    "TDS Suite"                          S "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-suite/\"" \
    "TDS Student"                        T "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-student/\"" \
    "Visitor Web App"                    V "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/branches/tds-visitor-web-app/\"" \
    "TDS Hexer"                          H "run-shell \"~/bin/.local/scripts/tmux-sessionizer ~/tds-branch-opener/tds-hexer/\"" \
    "" \
    "New Window"                         ␍ new-window \
    "Choose Window"                      w choose-window \
    "Previous Window"                    🡠 previous-window \
    "Next Window"                        🡢 next-window \
    "Swap Window Right"                  ↑ "swap-window -t -1" \
    "Swap Window Left"                   ↓ "swap-window -t +1" \
    "Horizontal Split"                   v "split-window -h" \
    "Vertical Split"                     s "split-window -v"  \
    "" \
    "Layout Horizontal"                  h "select-layout even-horizontal"  \
    "Layout Vertical"                    L "select-layout even-vertical"  \
    "" \
    "Swap Pane Up"                       < "swap-pane -U" \
    "Swap Pane Down"                     > "swap-pane -D" \
    "Break Pane"                         t break-pane \
    "Join Pane"                          j "choose-window 'join-pane -h -s \"%%\"'" \
    "" \
    "Kill Window"                        k "killw"  \
    "Kill Session"                       x "kill-session" \
    "Kill Other Session(s)"              X "kill-session -a"
