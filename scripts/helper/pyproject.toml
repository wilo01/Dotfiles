[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helper-cli"
version = "0.1.1"
description = "Development helper CLI for JIRA, badges, URLs, and automation tasks"
authors = [{name = "Helper CLI", email = "dev@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "click>=8.0.0",
    "pyshorteners>=1.0.0",
    "pyperclip>=1.8.0",
    "segno>=1.5.0",
    "pynput>=1.7.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "keyring>=24.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
helper = "helper_cli.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/helper-cli"
Repository = "https://github.com/yourusername/helper-cli.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
